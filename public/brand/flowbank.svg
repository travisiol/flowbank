<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1323 1189" width="1323" height="1189">
  <defs>
    <linearGradient id="back" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#0f4a3b"/>
      <stop offset="0.45" stop-color="#062c24"/>
      <stop offset="1" stop-color="#03251d"/>
    </linearGradient>
    <linearGradient id="backEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cf5c4" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#08d39a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#03b07f" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="front" x1="0.1" y1="0.05" x2="0.9" y2="1">
      <stop offset="0" stop-color="#d9ffef"/>
      <stop offset="0.22" stop-color="#8ffbd3"/>
      <stop offset="0.55" stop-color="#1fe8a5"/>
      <stop offset="1" stop-color="#00a874"/>
    </linearGradient>
    <linearGradient id="frontEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#6ff5c9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00c98a" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glossBack" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#7dffd6" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#7dffd6" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#7dffd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.75" cy="0.85" r="0.7">
      <stop offset="0" stop-color="#003d2b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#003d2b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="frontClip"><rect x="500" y="352" width="640" height="640" rx="150"/></clipPath>
    <clipPath id="backClip"><rect x="200" y="172" width="690" height="690" rx="160"/></clipPath>
  </defs>

  <!-- back shape -->
  <rect x="200" y="172" width="690" height="690" rx="160" fill="#04dba1" opacity="0.16" filter="url(#glow)"/>
  <rect x="200" y="172" width="690" height="690" rx="160" fill="url(#back)"/>
  <g clip-path="url(#backClip)">
    <rect x="200" y="172" width="690" height="690" fill="url(#glossBack)"/>
  </g>
  <rect x="202" y="174" width="686" height="686" rx="158" fill="none" stroke="url(#backEdge)" stroke-width="4"/>

  <!-- front shape -->
  <rect x="500" y="352" width="640" height="640" rx="150" fill="#3dffc0" opacity="0.2" filter="url(#glow)"/>
  <rect x="500" y="352" width="640" height="640" rx="150" fill="url(#front)"/>
  <g clip-path="url(#frontClip)">
    <rect x="500" y="352" width="640" height="640" fill="url(#gloss)"/>
    <rect x="500" y="352" width="640" height="640" fill="url(#shade)"/>
    <ellipse cx="575" cy="428" rx="46" ry="24" fill="#ffffff" opacity="0.7" filter="url(#soft)"/>
  </g>
  <rect x="502" y="354" width="636" height="636" rx="148" fill="none" stroke="url(#frontEdge)" stroke-width="4"/>
</svg>
